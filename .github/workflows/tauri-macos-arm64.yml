name: Build macOS Tauri App (Apple Silicon)

on:
  push:
    branches: ["**"]
    paths:
      - "apps/desktop-tauri/**"
      - "dist/**"
      - ".github/actions/setup-node-env/action.yml"
      - ".github/workflows/tauri-macos-arm64.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "apps/desktop-tauri/**"
      - "dist/**"
      - ".github/actions/setup-node-env/action.yml"
      - ".github/workflows/tauri-macos-arm64.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build from (for example v2026.4.10 or v2026.4.10-beta.1)
        required: true
        type: string
      draft:
        description: Create the GitHub release as a draft if it does not already exist
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark the GitHub release as a prerelease if it does not already exist
        required: true
        default: false
        type: boolean

concurrency:
  group: tauri-macos-arm64-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.x"
  PNPM_VERSION: "10.32.1"
  DESKTOP_DIR: apps/desktop-tauri
  OPENCLAW_DESKTOP_AUTO_BUMP: "0"

jobs:
  validate_macos_arm64:
    if: github.event_name != 'workflow_dispatch'
    name: Validate macOS arm64 build
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install-bun: "false"
          use-sticky-disk: "false"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop-tauri/src-tauri -> target

      - name: Build repository
        run: pnpm build

      - name: Build Control UI
        run: pnpm ui:build

      - name: Build Tauri macOS app
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          unset APPLE_SIGNING_IDENTITY
          pnpm tauri build --config src-tauri/tauri.macos.conf.json --target aarch64-apple-darwin

      - name: Locate build outputs
        id: artifacts
        run: |
          set -euo pipefail
          APP_PATH="$(find apps/desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find apps/desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-macos-arm64-app-${{ github.sha }}
          path: ${{ steps.artifacts.outputs.app_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-macos-arm64-dmg-${{ github.sha }}
          path: ${{ steps.artifacts.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 14

  release_macos_arm64:
    if: github.event_name == 'workflow_dispatch'
    name: Build and publish macOS arm64 release
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Validate release tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*((-beta\.[1-9][0-9]*)|(-[1-9][0-9]*))?$ ]]; then
            echo "Invalid release tag format: ${RELEASE_TAG}"
            exit 1
          fi

      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install-bun: "false"
          use-sticky-disk: "false"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop-tauri/src-tauri -> target

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_P12_BASE64:?Missing APPLE_CERTIFICATE_P12_BASE64 secret}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD secret}"
          CERT_PATH="$RUNNER_TEMP/openclaw-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/openclaw-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 18)"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build repository
        run: pnpm build

      - name: Build Control UI
        run: pnpm ui:build

      - name: Build signed macOS app
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          : "${APPLE_SIGNING_IDENTITY:?Missing APPLE_SIGNING_IDENTITY secret}"
          pnpm tauri build --config src-tauri/tauri.macos.conf.json --target aarch64-apple-darwin

      - name: Locate release artifacts
        id: artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          APP_PATH="$(find apps/desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find apps/desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          DSYM_PATH="$(find apps/desktop-tauri/src-tauri/target/aarch64-apple-darwin/release -name '*.dSYM' -print -quit)"
          APP_ZIP_PATH="$RUNNER_TEMP/OpenClaw-${VERSION}-macOS-arm64.zip"
          NOTARY_ZIP_PATH="$RUNNER_TEMP/OpenClaw-${VERSION}-macOS-arm64.notary.zip"
          DSYM_ZIP_PATH="$RUNNER_TEMP/OpenClaw-${VERSION}-macOS-arm64.dSYM.zip"

          [[ -n "$APP_PATH" ]] || { echo "Missing .app bundle"; exit 1; }
          [[ -n "$DMG_PATH" ]] || { echo "Missing .dmg bundle"; exit 1; }
          [[ -n "$DSYM_PATH" ]] || { echo "Missing dSYM bundle"; exit 1; }

          {
            echo "app_path=$APP_PATH"
            echo "dmg_path=$DMG_PATH"
            echo "dsym_path=$DSYM_PATH"
            echo "app_zip_path=$APP_ZIP_PATH"
            echo "notary_zip_path=$NOTARY_ZIP_PATH"
            echo "dsym_zip_path=$DSYM_ZIP_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Notarize app and staple bundle
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?Missing APPLE_ID secret}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD secret}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID secret}"

          rm -f "${{ steps.artifacts.outputs.notary_zip_path }}" "${{ steps.artifacts.outputs.app_zip_path }}"
          ditto -c -k --sequesterRsrc --keepParent "${{ steps.artifacts.outputs.app_path }}" "${{ steps.artifacts.outputs.notary_zip_path }}"
          xcrun notarytool submit "${{ steps.artifacts.outputs.notary_zip_path }}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${{ steps.artifacts.outputs.app_path }}"
          xcrun stapler validate "${{ steps.artifacts.outputs.app_path }}"
          ditto -c -k --sequesterRsrc --keepParent "${{ steps.artifacts.outputs.app_path }}" "${{ steps.artifacts.outputs.app_zip_path }}"

      - name: Sign, notarize, and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "${{ steps.artifacts.outputs.dmg_path }}"
          xcrun notarytool submit "${{ steps.artifacts.outputs.dmg_path }}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${{ steps.artifacts.outputs.dmg_path }}"
          xcrun stapler validate "${{ steps.artifacts.outputs.dmg_path }}"

      - name: Create dSYM zip
        run: |
          set -euo pipefail
          rm -f "${{ steps.artifacts.outputs.dsym_zip_path }}"
          ditto -c -k --keepParent "${{ steps.artifacts.outputs.dsym_path }}" "${{ steps.artifacts.outputs.dsym_zip_path }}"

      - name: Verify signed artifacts
        run: |
          set -euo pipefail
          codesign --verify --deep --strict "${{ steps.artifacts.outputs.app_path }}"
          spctl --assess --type open --context context:primary-signature --verbose "${{ steps.artifacts.outputs.app_path }}"
          spctl --assess --type open --context context:primary-signature --verbose "${{ steps.artifacts.outputs.dmg_path }}"

      - name: Upload macOS release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-macos-arm64-release-${{ inputs.tag }}
          path: |
            ${{ steps.artifacts.outputs.app_zip_path }}
            ${{ steps.artifacts.outputs.dmg_path }}
            ${{ steps.artifacts.outputs.dsym_zip_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            create_args=(
              "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --title "OpenClaw ${RELEASE_TAG#v}"
            )
            if [[ "$RELEASE_DRAFT" == "true" ]]; then
              create_args+=(--draft)
            fi
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi

      - name: Upload macOS release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "${{ steps.artifacts.outputs.app_zip_path }}" \
            "${{ steps.artifacts.outputs.dmg_path }}" \
            "${{ steps.artifacts.outputs.dsym_zip_path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Cleanup signing keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
