name: macOS Release (Legacy Redirect)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate before using the repo-owned macOS release workflow
        required: true
        type: string

concurrency:
  group: macos-release-redirect-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  redirect_to_tauri_release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate tag input format
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+((-beta\.[0-9]+)|(-[0-9]+))?$ ]]; then
            echo "Invalid release tag format: ${RELEASE_TAG}"
            exit 1
          fi

      - name: Summarize current macOS release entrypoint
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          {
            echo "## Use the repo-owned Tauri workflow"
            echo
            echo "macOS release automation now lives in \`.github/workflows/tauri-macos-arm64.yml\` in this repository."
            echo
            echo "Next step:"
            echo "- Run **Build macOS Tauri App (Apple Silicon)** with:"
            echo "  - \`tag=${RELEASE_TAG}\`"
            echo "  - \`draft=true|false\`"
            echo "  - \`prerelease=true|false\`"
            echo "- That workflow now owns signing, notarization, stapling, artifact packaging, and GitHub release upload."
          } >> "$GITHUB_STEP_SUMMARY"
